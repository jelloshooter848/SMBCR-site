name: Deploy

# Builds and checks the site on every pull request and push; deploys to GitHub Pages from main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # Repo variables (Settings → Secrets and variables → Actions → Variables) for a custom domain.
  SITE_URL: ${{ vars.SITE_URL || 'https://jelloshooter848.github.io' }}
  BASE_PATH: ${{ vars.BASE_PATH || '/SMBCR-site' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The older game versions on /versions/ (tools/archive): each vX.Y.0 tag of the game, built
      # once and kept in the Actions cache, so a deploy only builds a version it hasn't seen.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Restore archived game versions
        uses: actions/cache@v4
        with:
          path: .versions-cache
          key: versions-${{ hashFiles('tools/archive/**') }}-${{ env.BASE_PATH }}-${{ github.run_id }}
          restore-keys: versions-${{ hashFiles('tools/archive/**') }}-${{ env.BASE_PATH }}-

      - name: Build archived game versions
        run: npm run versions

      - name: Build
        run: npm run build

      - name: HTML validity
        run: npm run check:html

      - name: Internal links
        run: npm run check:links

      - name: Install Chromium for the accessibility check
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe, desktop and phone)
        run: npm run check:a11y

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
